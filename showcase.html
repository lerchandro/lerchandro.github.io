<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAM — Showcase</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #fff;
    }

    body {
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* INTRO */

    .intro {
      width: 100%;
      height: 100svh;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .square-stack {
      position: relative;
      width: 420px;
      height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .square {
      position: absolute;
      width: 260px;
      height: 260px;
      background: var(--color);
      opacity: 0.55;
      border-radius: 2px;
      filter: blur(12px);
      mix-blend-mode: multiply;
      transform-origin: center;
      animation: organic-spin var(--duration) ease-in-out
        var(--delay) infinite alternate;
      will-change: transform;
      pointer-events: none;
    }

    /* RED */

    .square:nth-child(1) {
      --color: #ff1744;
      --duration: 3.75s;
      --delay: -0.3s;
      width: 250px;
      height: 250px;
      opacity: 0.58;
    }

    .square:nth-child(2) {
      --color: #ff1744;
      --duration: 5.25s;
      --delay: -1.1s;
      width: 290px;
      height: 230px;
      opacity: 0.45;
    }

    .square:nth-child(3) {
      --color: #ff1744;
      --duration: 4.5s;
      --delay: -0.7s;
      width: 230px;
      height: 300px;
      opacity: 0.50;
    }

    /* YELLOW */

    .square:nth-child(4) {
      --color: #ffea00;
      --duration: 6.5s;
      --delay: -2s;
      width: 300px;
      height: 260px;
      opacity: 0.65;
    }

    .square:nth-child(5) {
      --color: #ffea00;
      --duration: 4.25s;
      --delay: -1.4s;
      width: 270px;
      height: 280px;
      opacity: 0.55;
    }

    .square:nth-child(6) {
      --color: #ffea00;
      --duration: 5.75s;
      --delay: -0.4s;
      width: 240px;
      height: 310px;
      opacity: 0.58;
    }

    /* BLUE */

    .square:nth-child(7) {
      --color: #164bff;
      --duration: 3.5s;
      --delay: -1.2s;
      width: 310px;
      height: 240px;
      opacity: 0.58;
    }

    .square:nth-child(8) {
      --color: #164bff;
      --duration: 7s;
      --delay: -0.9s;
      width: 280px;
      height: 280px;
      opacity: 0.50;
    }

    .square:nth-child(9) {
      --color: #164bff;
      --duration: 4.75s;
      --delay: -1.6s;
      width: 220px;
      height: 290px;
      opacity: 0.62;
    }

    /* PURPLE */

    .square:nth-child(10) {
      --color: #8a2be2;
      --duration: 6s;
      --delay: -0.6s;
      width: 300px;
      height: 300px;
      opacity: 0.55;
    }

    .square:nth-child(11) {
      --color: #8a2be2;
      --duration: 3.25s;
      --delay: -0.8s;
      width: 210px;
      height: 260px;
      opacity: 0.65;
      filter: blur(9px);
    }

    /* EXTRA OVERLAPPING LAYERS */

    .square:nth-child(12) {
      --color: #ff1744;
      --duration: 4s;
      --delay: -0.2s;
      width: 260px;
      height: 210px;
      opacity: 0.60;
      filter: blur(10px);
    }

    .square:nth-child(13) {
      --color: #ffea00;
      --duration: 4.75s;
      --delay: -1.3s;
      width: 180px;
      height: 240px;
      opacity: 0.70;
      filter: blur(8px);
    }

    .square:nth-child(14) {
      --color: #164bff;
      --duration: 3.75s;
      --delay: -0.5s;
      width: 240px;
      height: 180px;
      opacity: 0.62;
      filter: blur(10px);
    }

    .square:nth-child(15) {
      --color: #8a2be2;
      --duration: 5s;
      --delay: -1s;
      width: 220px;
      height: 220px;
      opacity: 0.72;
      filter: blur(7px);
    }

    @keyframes organic-spin {
      0% {
        transform: rotate(-25deg) scale(0.85)
          translate(-8px, 5px);
      }

      50% {
        transform: rotate(20deg) scale(1.05)
          translate(7px, -6px);
      }

      100% {
        transform: rotate(65deg) scale(0.92)
          translate(-4px, -3px);
      }
    }

    .stack-label {
      position: relative;
      z-index: 2;
      color: #fff;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: -0.07em;
      padding-right: 0.07em;
      user-select: none;
      pointer-events: none;
      -webkit-text-stroke: 1px rgba(0, 0, 0, 0.35);
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
    }

    /* SHOWCASE */

    .showcase {
      width: 100%;
      padding: 8vw 7vw 5vw;
      background: #fff;
    }

    .project {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(220px, 0.7fr);
      align-items: center;
      gap: clamp(28px, 6vw, 100px);
      margin-bottom: clamp(100px, 16vw, 230px);
    }

    /* Alternate image and description */

    .project:nth-child(even) {
      grid-template-columns: minmax(220px, 0.7fr) minmax(0, 1.5fr);
    }

    .project:nth-child(even) .project-image {
      order: 2;
    }

    .project:nth-child(even) .project-description {
      order: 1;
    }

    .project-image {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .project-image img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
    }

    .project-description {
      max-width: 440px;
      justify-self: center;
      width: 100%;
      color: #000;
    }

    .project-number {
      font-size: 12px;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
      color: #777;
    }

    .project-description h2 {
      font-size: clamp(25px, 3vw, 44px);
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: -0.045em;
      margin-bottom: 22px;
      color: #000;
    }

    .project-description p {
      font-size: clamp(14px, 1.1vw, 17px);
      font-weight: 400;
      line-height: 1.7;
      color: #222;
      max-width: 360px;
    }

    /* FINAL SMALL EMBLEM AND EDITABLE TEXT */

    .closing-section {
      width: 100%;
      padding: 0 20px 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fff;
    }

    .closing-image {
      width: 45px;
      max-width: 45px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }

    .closing-image img {
      display: block;
      width: 100%;
      max-width: 45px;
      height: auto;
      max-height: 45px;
      object-fit: contain;
    }

    .closing-text {
      width: 100%;
      max-width: 600px;
      margin-top: 25px;
      text-align: center;
      color: #000;
    }

    .closing-text h2 {
      font-size: clamp(25px, 3vw, 40px);
      line-height: 1.1;
      font-weight: 500;
      letter-spacing: -0.045em;
      margin-bottom: 18px;
    }

    .closing-text p {
      font-size: clamp(14px, 1.1vw, 17px);
      line-height: 1.7;
      color: #222;
    }

    /* BACK TO TOP */

    .back-to-top {
      width: 100%;
      padding: 20px 20px 70px;
      display: flex;
      justify-content: center;
      background: #fff;
    }

    .back-to-top button {
      background: transparent;
      color: #000;
      border: 1px solid #000;
      border-radius: 100px;
      padding: 16px 30px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .back-to-top button:hover {
      background: #000;
      color: #fff;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .intro {
        min-height: 100svh;
      }

      .square-stack {
        transform: scale(0.78);
      }

      .showcase {
        padding: 24px 20px 40px;
      }

      .project,
      .project:nth-child(even) {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 28px;
        margin-bottom: 100px;
      }

      .project:nth-child(even) .project-image,
      .project:nth-child(even) .project-description {
        order: initial;
      }

      .project-image img {
        max-height: none;
      }

      .project-description {
        max-width: none;
        padding: 0 2px;
      }

      .project-number {
        margin-bottom: 14px;
      }

      .project-description h2 {
        font-size: 30px;
        margin-bottom: 14px;
      }

      .project-description p {
        font-size: 15px;
      }

      /* Tiny emblem on mobile */

      .closing-section {
        padding: 0 20px 70px;
      }

      .closing-image {
        width: 30px;
        max-width: 30px;
      }

      .closing-image img {
        width: 30px;
        max-width: 30px;
        max-height: 30px;
      }

      .closing-text {
        margin-top: 24px;
      }

      .closing-text h2 {
        font-size: 30px;
      }

      .closing-text p {
        font-size: 15px;
      }
    }

    /* REDUCED MOTION ACCESSIBILITY */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .square {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- FIRST SCREEN: COLORED LAM LOGO -->

  <section class="intro" id="top">
    <div class="square-stack" aria-label="LAM animated color logo">
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>

      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>

      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>

      <span class="stack-label">LAM</span>
    </div>
  </section>

  <!-- SHOWCASE IMAGES AND DESCRIPTIONS -->

  <main class="showcase" id="showcase"></main>

  <!-- FINAL TINY EMBLEM: logo01.jpg -->

  <section class="closing-section">
    <div class="closing-image">
      <img src="logo01.jpg" alt="LAM emblem">
    </div>

    <div class="closing-text">
      <!-- EDIT YOUR HEADING HERE -->
      <h2></h2>

      <!-- EDIT YOUR TEXT HERE -->
      <p>
        Es wurde keine KI zum erstellen von Fotos genutzt.
      </p>
    </div>
  </section>

  <!-- BACK TO TOP -->

  <footer class="back-to-top">
    <button
      type="button"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
    >
      BACK TO TOP ↑
    </button>
  </footer>

  <script>
    const showcase = document.getElementById("showcase");

    // EDIT YOUR SHOWCASE DESCRIPTIONS HERE.

    const descriptions = {
      1: {
        title: "Untitled 01",
        text: "Farrahd in Altstadt Rgensburg."
      },
      2: {
        title: "Untitled 02",
        text: "Noch ein Farrahd."
      },
      3: {
        title: "Untitled 03",
        text: "Menschen am Strand."
      },
      4: {
        title: "Sonnencreme",
        text: ""
      },
      5: {
        title: "Trio",
        text: "LLM URTEIL: Trio – Ein Augenblick der Verbundenheit Drei Menschen stehen am Ufer und genießen den Sonnenuntergang. Das warme Licht und die ruhige Atmosphäre vermitteln ein Gefühl von Freiheit und Zusammengehörigkeit. Die Gesichter bleiben verborgen, wodurch der Moment geheimnisvoll und persönlich wirkt. Als Fotograf möchte ich zeigen, dass oft die einfachen Augenblicke im Leben besonders wertvoll sind. Für mich symbolisiert das Bild Freundschaft, Vergänglichkeit und die Schönheit des gemeinsamen Moments."
      },
      6: {
        title: "Haus",
        text: "Dach eines Hauses"
      },
      7: {
        title: "Shadow-Gum",
        text: "Recycled alte Bilder."
      },
      8: {
        title: "D-Lightful",
        text: "Digital Version"
      },
      9: {
        title: "freedom",
        text: "boredom"
      },
      10: {
        title: "Untitled Space",
        text: "Maximalist Version"
      }
    };

    // Set this to the number of your last showcase image.
    // Example: image20.jpg means TOTAL_IMAGES = 20.

    const TOTAL_IMAGES = 20;

    async function buildShowcase() {
      for (let number = 1; number <= TOTAL_IMAGES; number++) {
        const paddedNumber = String(number).padStart(2, "0");
        const filename = `image${paddedNumber}.jpg`;

        const image = new Image();
        image.src = filename;

        try {
          await image.decode();
        } catch {
          console.warn(`Could not load: ${filename}`);
          continue;
        }

        const info = descriptions[number] || {
          title: `Untitled ${paddedNumber}`,
          text: "Add your description here."
        };

        const project = document.createElement("section");
        project.className = "project";

        const imageContainer = document.createElement("div");
        imageContainer.className = "project-image";

        const displayedImage = document.createElement("img");
        displayedImage.src = filename;
        displayedImage.alt = info.title;
        displayedImage.loading = "lazy";

        const description = document.createElement("div");
        description.className = "project-description";

        const projectNumber = document.createElement("div");
        projectNumber.className = "project-number";
        projectNumber.textContent = `${paddedNumber} / LAM`;

        const heading = document.createElement("h2");
        heading.textContent = info.title;

        const paragraph = document.createElement("p");
        paragraph.textContent = info.text;

        imageContainer.appendChild(displayedImage);

        description.appendChild(projectNumber);
        description.appendChild(heading);
        description.appendChild(paragraph);

        project.appendChild(imageContainer);
        project.appendChild(description);

        showcase.appendChild(project);
      }
    }

    buildShowcase();
  </script>

</body>
</html>
