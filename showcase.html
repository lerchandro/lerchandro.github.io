
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAM — Showcase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f5f5f5;
            color: #111;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        /* INTRO */

        .intro {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            text-align: center;
            padding: 40px 20px;
        }

        .logo-animation {
            width: 100px;
            height: 100px;
            position: relative;
            animation: logoFloat 3s ease-in-out infinite;
        }

        .logo-square {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 8px;
            animation: colorChange 5s linear infinite;
        }

        .logo-square:nth-child(1) {
            top: 0;
            left: 0;
            animation-delay: 0s;
        }

        .logo-square:nth-child(2) {
            top: 0;
            right: 0;
            animation-delay: 1.25s;
        }

        .logo-square:nth-child(3) {
            bottom: 0;
            left: 0;
            animation-delay: 2.5s;
        }

        .logo-square:nth-child(4) {
            bottom: 0;
            right: 0;
            animation-delay: 3.75s;
        }

        .intro h1 {
            font-size: clamp(2.5rem, 7vw, 5rem);
            letter-spacing: 0.15em;
            font-weight: 800;
        }

        .intro p {
            font-size: 1rem;
            letter-spacing: 0.2em;
            color: #777;
        }

        @keyframes colorChange {
            0% {
                background: #ff4d4d;
            }
            25% {
                background: #ffcc00;
            }
            50% {
                background: #25c98b;
            }
            75% {
                background: #3987ff;
            }
            100% {
                background: #b44dff;
            }
        }

        @keyframes logoFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        /* SHOWCASE */

        #showcase {
            width: 100%;
        }

        .showcase-item {
            width: 100%;
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5%;
            padding: 8vw 10%;
        }

        .showcase-item:nth-child(even) {
            flex-direction: row-reverse;
        }

        .image-container,
        .description {
            width: 47.5%;
        }

        .image-container {
            overflow: hidden;
            background: #e7e7e7;
        }

        .image-container img {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
            transition: transform 0.7s ease;
        }

        .image-container:hover img {
            transform: scale(1.035);
        }

        .description {
            padding: 20px;
        }

        .description h2 {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .description p {
            font-size: clamp(1rem, 1.3vw, 1.15rem);
            line-height: 1.8;
            color: #555;
        }

        /* IMAGE REVEAL ANIMATION */

        .reveal {
            opacity: 0;
            transform: translateY(35px);
            transition:
                opacity 0.8s ease,
                transform 0.8s ease;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* CLOSING SECTION */

        .closing {
            min-height: 45vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 70px 20px;
            gap: 25px;
        }

        .closing-image {
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .closing-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .closing h2 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .closing p {
            font-size: 0.9rem;
            color: #777;
            line-height: 1.6;
        }

        /* BACK TO TOP */

        #backToTop {
            position: fixed;
            right: 25px;
            bottom: 25px;
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 50%;
            background: #111;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition:
                opacity 0.3s ease,
                visibility 0.3s ease,
                transform 0.3s ease;
            z-index: 1000;
        }

        #backToTop.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        #backToTop:hover {
            background: #444;
        }

        /* MOBILE */

        @media (max-width: 768px) {
            .intro {
                min-height: 85vh;
            }

            .showcase-item,
            .showcase-item:nth-child(even) {
                min-height: auto;
                flex-direction: column;
                gap: 20px;
                padding: 45px 6%;
            }

            .image-container,
            .description {
                width: 100%;
            }

            .description {
                padding: 15px 5px;
            }

            .description h2 {
                margin-bottom: 12px;
            }

            .closing {
                min-height: 35vh;
                padding: 50px 20px;
                gap: 20px;
            }

            .closing-image {
                width: 110px;
                height: 110px;
            }

            .closing h2 {
                font-size: 1.25rem;
            }

            #backToTop {
                right: 15px;
                bottom: 15px;
                width: 40px;
                height: 40px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <!-- INTRO -->
    <section class="intro">
        <div class="logo-animation" aria-label="LAM Logo">
            <div class="logo-square"></div>
            <div class="logo-square"></div>
            <div class="logo-square"></div>
            <div class="logo-square"></div>
        </div>

        <h1>LAM</h1>
        <p>CREATIVE SHOWCASE</p>
    </section>

    <!-- SHOWCASE IMAGES -->
    <main id="showcase"></main>

    <!-- CLOSING SECTION -->
    <section class="closing">
        <div class="closing-image">
            <img src="logo01.jpg" alt="LAM Emblem">
        </div>

        <h2></h2>

        <p>Es wurde keine KI zum erstellen von Fotos genutzt.</p>
    </section>

    <!-- BACK TO TOP -->
    <button id="backToTop" aria-label="Back to top" title="Back to top">
        ↑
    </button>

    <script>
        const TOTAL_IMAGES = 20;

        const descriptions = {
            1: {
                title: "Projekt 01",
                text: "Eine visuelle Arbeit, bei der Form, Licht und Komposition miteinander verbunden werden."
            },
            2: {
                title: "Projekt 02",
                text: "Ein experimenteller Ansatz mit besonderem Fokus auf Details und Atmosphäre."
            },
            3: {
                title: "Projekt 03",
                text: "Eine eigenständige Bildsprache, die durch klare Linien und bewusste Gestaltung entsteht."
            },
            4: {
                title: "Projekt 04",
                text: "Das Zusammenspiel von Perspektive, Struktur und visueller Wirkung steht im Mittelpunkt."
            },
            5: {
                title: "Projekt 05",
                text: "Eine weitere kreative Arbeit, die unterschiedliche Formen und Stimmungen kombiniert."
            },
            6: {
                title: "Projekt 06",
                text: "Eine Studie über Kontraste, Bildaufbau und die Wirkung einzelner Elemente."
            },
            7: {
                title: "Projekt 07",
                text: "Experimentelle Gestaltung mit einer klaren visuellen Idee und einem eigenen Charakter."
            },
            8: {
                title: "Projekt 08",
                text: "Hier treffen Details und Gesamtkomposition aufeinander und bilden eine visuelle Einheit."
            },
            9: {
                title: "Projekt 09",
                text: "Eine kreative Interpretation von Form, Raum und visueller Balance."
            },
            10: {
                title: "Projekt 10",
                text: "Eine Arbeit, die den Blick auf Gestaltung, Details und die Wirkung des Bildes lenkt."
            }
        };

        const showcase = document.getElementById("showcase");

        for (let i = 1; i <= TOTAL_IMAGES; i++) {
            const item = document.createElement("section");
            item.className = "showcase-item reveal";

            const imageContainer = document.createElement("div");
            imageContainer.className = "image-container";

            const image = document.createElement("img");
            image.src = `image${String(i).padStart(2, "0")}.jpg`;
            image.alt = `LAM Showcase Bild ${i}`;
            image.loading = "lazy";

            imageContainer.appendChild(image);

            const description = document.createElement("div");
            description.className = "description";

            const content = descriptions[i] || {
                title: `Projekt ${String(i).padStart(2, "0")}`,
                text: "Eine weitere Arbeit aus dem LAM Showcase."
            };

            const heading = document.createElement("h2");
            heading.textContent = content.title;

            const paragraph = document.createElement("p");
            paragraph.textContent = content.text;

            description.appendChild(heading);
            description.appendChild(paragraph);

            item.appendChild(imageContainer);
            item.appendChild(description);

            showcase.appendChild(item);
        }

        /* REVEAL ITEMS ON SCROLL */

        const revealObserver = new IntersectionObserver(
            (entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("visible");
                        revealObserver.unobserve(entry.target);
                    }
                });
            },
            {
                threshold: 0.12
            }
        );

        document.querySelectorAll(".reveal").forEach((item) => {
            revealObserver.observe(item);
        });

        /* BACK TO TOP BUTTON */

        const backToTop = document.getElementById("backToTop");

        window.addEventListener("scroll", () => {
            if (window.scrollY > 400) {
                backToTop.classList.add("visible");
            } else {
                backToTop.classList.remove("visible");
            }
        });

        backToTop.addEventListener("click", () => {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
    </script>

</body>
</html>
