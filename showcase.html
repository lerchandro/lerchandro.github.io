
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAM — Showcase</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: #fff;
    }

    body {
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* INTRO */

    .intro {
      width: 100%;
      height: 100svh;
      min-height: 500px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }

    .square-stack {
      position: relative;
      width: 540px;
      height: 540px;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    .square {
      position: absolute;
      width: 320px;
      height: 320px;
      background: var(--color);
      opacity: 0.55;
      border-radius: 2px;
      filter: blur(14px);
      mix-blend-mode: multiply;
      transform-origin: center;
      animation: organic-spin var(--duration) ease-in-out
        var(--delay) infinite alternate;
      will-change: transform;
      pointer-events: none;
    }

    /* RED */

    .square:nth-child(1) {
      --color: #ff1744;
      --duration: 3.2s;
      --delay: -0.3s;
      width: 310px;
      height: 310px;
      opacity: 0.58;
    }

    .square:nth-child(2) {
      --color: #ff1744;
      --duration: 4.2s;
      --delay: -1.1s;
      width: 360px;
      height: 290px;
      opacity: 0.45;
    }

    .square:nth-child(3) {
      --color: #ff1744;
      --duration: 3.7s;
      --delay: -0.7s;
      width: 290px;
      height: 370px;
      opacity: 0.50;
    }

    /* YELLOW */

    .square:nth-child(4) {
      --color: #ffea00;
      --duration: 4.8s;
      --delay: -2s;
      width: 370px;
      height: 320px;
      opacity: 0.65;
    }

    .square:nth-child(5) {
      --color: #ffea00;
      --duration: 3.6s;
      --delay: -1.4s;
      width: 340px;
      height: 350px;
      opacity: 0.55;
    }

    .square:nth-child(6) {
      --color: #ffea00;
      --duration: 4.4s;
      --delay: -0.4s;
      width: 300px;
      height: 380px;
      opacity: 0.58;
    }

    /* BLUE */

    .square:nth-child(7) {
      --color: #164bff;
      --duration: 3.1s;
      --delay: -1.2s;
      width: 380px;
      height: 300px;
      opacity: 0.58;
    }

    .square:nth-child(8) {
      --color: #164bff;
      --duration: 5.0s;
      --delay: -0.9s;
      width: 350px;
      height: 350px;
      opacity: 0.50;
    }

    .square:nth-child(9) {
      --color: #164bff;
      --duration: 4.0s;
      --delay: -1.6s;
      width: 280px;
      height: 360px;
      opacity: 0.62;
    }

    /* PURPLE */

    .square:nth-child(10) {
      --color: #8a2be2;
      --duration: 4.6s;
      --delay: -0.6s;
      width: 370px;
      height: 370px;
      opacity: 0.55;
    }

    .square:nth-child(11) {
      --color: #8a2be2;
      --duration: 3.4s;
      --delay: -0.8s;
      width: 270px;
      height: 320px;
      opacity: 0.65;
      filter: blur(11px);
    }

    /* EXTRA OVERLAPPING LAYERS */

    .square:nth-child(12) {
      --color: #ff1744;
      --duration: 3.5s;
      --delay: -0.2s;
      width: 320px;
      height: 270px;
      opacity: 0.60;
      filter: blur(12px);
    }

    .square:nth-child(13) {
      --color: #ffea00;
      --duration: 4s;
      --delay: -1.3s;
      width: 240px;
      height: 300px;
      opacity: 0.70;
      filter: blur(10px);
    }

    .square:nth-child(14) {
      --color: #164bff;
      --duration: 3.3s;
      --delay: -0.5s;
      width: 300px;
      height: 240px;
      opacity: 0.62;
      filter: blur(12px);
    }

    .square:nth-child(15) {
      --color: #8a2be2;
      --duration: 4.1s;
      --delay: -1s;
      width: 280px;
      height: 280px;
      opacity: 0.72;
      filter: blur(9px);
    }

    @keyframes organic-spin {
      0% {
        transform: rotate(-25deg) scale(0.90)
          translate(-8px, 5px);
      }

      50% {
        transform: rotate(20deg) scale(1.03)
          translate(7px, -6px);
      }

      100% {
        transform: rotate(65deg) scale(0.94)
          translate(-4px, -3px);
      }
    }

    .stack-label {
      position: relative;
      z-index: 2;
      color: #fff;
      font-size: clamp(64px, 7vw, 76px);
      font-weight: 900;
      letter-spacing: -0.07em;
      padding-right: 0.07em;
      user-select: none;
      pointer-events: none;
      -webkit-text-stroke: 1.3px rgba(0, 0, 0, 0.35);
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
    }

    /* SHOWCASE */

    .showcase {
      width: 100%;
      padding: 8vw 7vw 5vw;
      background: #fff;
    }

    .project {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(220px, 0.7fr);
      align-items: center;
      gap: clamp(28px, 6vw, 100px);
      margin-bottom: clamp(100px, 16vw, 230px);
    }

    .project:nth-child(even) {
      grid-template-columns: minmax(220px, 0.7fr) minmax(0, 1.5fr);
    }

    .project:nth-child(even) .project-image {
      order: 2;
    }

    .project:nth-child(even) .project-description {
      order: 1;
    }

    .project-image {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
    }

    .project-image img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 85vh;
      object-fit: contain;
    }

    .project-description {
      max-width: 440px;
      justify-self: center;
      width: 100%;
      color: #000;
    }

    .project-number {
      font-size: 12px;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
      color: #777;
    }

    .project-description h2 {
      font-size: clamp(25px, 3vw, 44px);
      line-height: 1.05;
      font-weight: 500;
      letter-spacing: -0.045em;
      margin-bottom: 22px;
      color: #000;
    }

    .project-description p {
      font-size: clamp(14px, 1.1vw, 17px);
      font-weight: 400;
      line-height: 1.7;
      color: #222;
      max-width: 360px;
    }

    /* BACK TO TOP */

    .back-to-top {
      width: 100%;
      padding: 20px 20px 70px;
      display: flex;
      justify-content: center;
      background: #fff;
    }

    .back-to-top button {
      background: transparent;
      color: #000;
      border: 1px solid #000;
      border-radius: 100px;
      padding: 16px 30px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .back-to-top button:hover {
      background: #000;
      color: #fff;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .intro {
        min-height: 100svh;
      }

      .square-stack {
        transform: scale(0.88);
      }

      .stack-label {
        font-size: 68px;
      }

      .showcase {
        padding: 24px 20px 40px;
      }

      .project,
      .project:nth-child(even) {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 28px;
        margin-bottom: 100px;
      }

      .project:nth-child(even) .project-image,
      .project:nth-child(even) .project-description {
        order: initial;
      }

      .project-image img {
        max-height: none;
      }

      .project-description {
        max-width: none;
        padding: 0 2px;
      }

      .project-number {
        margin-bottom: 14px;
      }

      .project-description h2 {
        font-size: 30px;
        margin-bottom: 14px;
      }

      .project-description p {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .square {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- FIRST SCREEN: COLORED LAM LOGO -->

  <section class="intro" id="top">
    <div class="square-stack" aria-label="LAM animated color logo">
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>

      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>

      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>
      <div class="square"></div>

      <span class="stack-label">LAM</span>
    </div>
  </section>

  <!-- IMAGES AND DESCRIPTIONS -->

  <main class="showcase" id="showcase"></main>

  <!-- BACK TO TOP -->

  <footer class="back-to-top">
    <button
      type="button"
      onclick="window.scrollTo({ top: 0, behavior: 'smooth' })"
    >
      BACK TO TOP ↑
    </button>
  </footer>

  <script>
    const showcase = document.getElementById("showcase");

    // Add or edit descriptions for your images here.
    const descriptions = {
      1: {
        title: "Untitled 01",
        text: "Add your description for the first image here."
      },
      2: {
        title: "Untitled 02",
        text: "Add your description for the second image here."
      },
      3: {
        title: "Untitled 03",
        text: "Add your description for the third image here."
      },
      4: {
        title: "Untitled 04",
        text: "Add your description for the fourth image here."
      }
    };

    // Set this to the number of your last image.
    // Example: image37.jpg means TOTAL_IMAGES = 37.
    const TOTAL_IMAGES = 20;

    async function buildShowcase() {
      for (let number = 1; number <= TOTAL_IMAGES; number++) {
        const paddedNumber = String(number).padStart(2, "0");
        const filename = `image${paddedNumber}.jpg`;

        const image = new Image();
        image.src = filename;

        try {
          // Process images in numerical order.
          await image.decode();
        } catch {
          console.warn(`Could not load: ${filename}`);
          continue;
        }

        const info = descriptions[number] || {
          title: `Untitled ${paddedNumber}`,
          text: "Add your description here."
        };

        const project = document.createElement("section");
        project.className = "project";

        const imageContainer = document.createElement("div");
        imageContainer.className = "project-image";

        const displayedImage = document.createElement("img");
        displayedImage.src = filename;
        displayedImage.alt = info.title;
        displayedImage.loading = "lazy";

        const description = document.createElement("div");
        description.className = "project-description";

        const projectNumber = document.createElement("div");
        projectNumber.className = "project-number";
        projectNumber.textContent = `${paddedNumber} / LAM`;

        const heading = document.createElement("h2");
        heading.textContent = info.title;

        const paragraph = document.createElement("p");
        paragraph.textContent = info.text;

        imageContainer.appendChild(displayedImage);

        description.appendChild(projectNumber);
        description.appendChild(heading);
        description.appendChild(paragraph);

        project.appendChild(imageContainer);
        project.appendChild(description);

        // Add each image before moving to the next.
        showcase.appendChild(project);
      }
    }

    buildShowcase();
  </script>

</body>
</html>
