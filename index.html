<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Light Scroll</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
      background: #cfcfcf;
    }


    /* =========================================
       PAGE
    ========================================= */

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;

      /*
        BASE BACKGROUND

        The page starts light gray and gradually
        becomes black farther away from the light.
      */

      background: #cfcfcf;
    }


    /* =========================================
       CONTINUOUS LIGHT / BACKGROUND

       IMPORTANT:
       This layer is attached to the document,
       NOT fixed to the viewport.

       The light starts in the center of the
       first screen and extends through the
       entire page.
    ========================================= */

    .page::before {
      content: "";

      position: absolute;

      /*
        Make the background layer cover the
        entire scrolling document.
      */

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      z-index: 0;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse 75vw 75vw at 50% 50vh,

          /* warm center */
          rgba(255, 196, 135, 0.70) 0%,

          /* warm white */
          rgba(255, 220, 180, 0.48) 12%,

          /* soft warm light */
          rgba(245, 225, 205, 0.30) 25%,

          /* gray */
          rgba(210, 210, 210, 0.18) 40%,

          /* fading */
          rgba(150, 150, 150, 0.08) 55%,

          /* almost gone */
          rgba(0, 0, 0, 0.20) 70%,

          /* darkness */
          rgba(0, 0, 0, 0.75) 90%,

          #000 100%
        );

      /*
        Prevent the browser from creating
        another background repetition.
      */

      background-repeat: no-repeat;
      background-size: 100% 100%;
    }


    /* =========================================
       CONTENT LAYER
    ========================================= */

    .content {
      position: relative;

      z-index: 1;

      width: 100%;
    }


    /* =========================================
       FIRST IMAGE
    ========================================= */

    .hero {
      position: relative;

      width: 100%;
      height: 100vh;
      height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .hero img {
      display: block;

      width: 100vw;
      max-width: none;

      height: auto;

      object-fit: contain;
      object-position: center;
    }


    /* =========================================
       DARK TRANSITION

       Creates distance between the first
       image and the second image.
    ========================================= */

    .dark-space {
      width: 100%;
      height: 100vh;

      background: transparent;
    }


    /* =========================================
       SECOND IMAGE
    ========================================= */

    .second {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      overflow: hidden;
    }

    .second img {
      display: block;

      width: 100vw;
      max-width: none;

      height: auto;

      object-fit: contain;
      object-position: center;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      .page::before {
        background:
          radial-gradient(
            ellipse 115vw 115vw at 50% 50svh,

            rgba(255, 196, 135, 0.70) 0%,

            rgba(255, 220, 180, 0.48) 12%,

            rgba(245, 225, 205, 0.30) 25%,

            rgba(210, 210, 210, 0.18) 40%,

            rgba(150, 150, 150, 0.08) 55%,

            rgba(0, 0, 0, 0.20) 70%,

            rgba(0, 0, 0, 0.75) 90%,

            #000 100%
          );

        background-repeat: no-repeat;
        background-size: 100% 100%;
      }


      .hero {
        width: 100%;
        height: 100svh;
      }


      .hero img {
        width: 100vw;
        max-width: none;

        height: auto;

        object-fit: contain;
        object-position: center;
      }


      .dark-space {
        height: 80vh;
      }


      .second {
        width: 100%;
        min-height: 100svh;
      }


      .second img {
        width: 100vw;
        max-width: none;

        height: auto;

        object-fit: contain;
        object-position: center;
      }
    }

  </style>
</head>


<body>

  <main class="page">

    <div class="content">

      <!-- =====================================
           FIRST IMAGE
      ====================================== -->

      <section class="hero">

        <img
          src="image-1.jpg"
          alt=""
        >

      </section>


      <!-- =====================================
           DARK SPACE
      ====================================== -->

      <section class="dark-space"></section>


      <!-- =====================================
           SECOND IMAGE
      ====================================== -->

      <section class="second">

        <img
          src="image-2.jpg"
          alt=""
        >

      </section>

    </div>

  </main>

</body>
</html>
