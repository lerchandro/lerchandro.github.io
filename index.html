<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lerchandro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #292825;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            min-height: 100vh;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Profilbereich */
        .profile {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .profile-image {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(
                circle at 50% 50%,
                #050505 0 25%,
                transparent 25.5%
            ),
            linear-gradient(
                to right,
                #080808 0 35%,
                transparent 35.5%
            ),
            #dedbd1;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .info {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 15px;
            margin-bottom: 12px;
            color: #e5e5e5;
        }

        h1 {
            font-size: clamp(55px, 9vw, 95px);
            line-height: 0.95;
            font-weight: 800;
            letter-spacing: -5px;
        }

        /* Links */
        .links {
            display: flex;
            gap: 15px;
            margin-left: 250px;
            margin-top: 35px;
        }

        .links a {
            text-decoration: none;
            color: white;
            background: #3a3935;
            border: 1px solid #55534e;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.25s ease;
        }

        .links a:hover {
            background: white;
            color: #292825;
            transform: translateY(-3px);
        }

        /* Handy */
        @media (max-width: 700px) {
            .container {
                padding: 40px 25px;
            }

            .profile {
                flex-direction: column;
                align-items: flex-start;
            }

            .profile-image {
                width: 160px;
                height: 160px;
            }

            h1 {
                font-size: 58px;
                letter-spacing: -3px;
            }

            .links {
                margin-left: 0;
                margin-top: 30px;
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <section class="profile">

            <div class="profile-image"></div>

            <div class="info">
                <span class="label">Profil</span>
                <h1>Lerchandro</h1>
            </div>

        </section>

        <nav class="links">
            <a href="https://open.spotify.com/" target="_blank">
                Spotify
            </a>

            <a href="https://www.pinterest.com/" target="_blank">
                Pinterest
            </a>

            <a href="https://www.instagram.com/" target="_blank">
                Instagram
            </a>
        </nav>

    </main>

</body>
</html>
