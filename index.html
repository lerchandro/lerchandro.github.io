<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>lerchandro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      overflow-x: hidden;
      background: #000;
    }


    /* =========================================
       SVG FILTER
    ========================================= */

    .svg-filters {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
      pointer-events: none;
    }


    /* =========================================
       PAGE
    ========================================= */

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;

      background:
        radial-gradient(
          ellipse 110vw 110vw at 50% 50vh,

          rgba(255, 230, 100, 0.95) 0%,
          rgba(255, 228, 120, 0.78) 15%,
          rgba(248, 230, 165, 0.58) 30%,
          rgba(220, 218, 195, 0.38) 45%,
          rgba(170, 170, 165, 0.18) 60%,
          rgba(60, 60, 55, 0.40) 78%,
          rgba(0, 0, 0, 0.85) 94%,
          #000 100%
        );

      background-repeat: no-repeat;
      background-color: #000;
    }


    /* =========================================
       CONTENT
    ========================================= */

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
    }


    /* =========================================
       HERO
    ========================================= */

    .hero {
      position: relative;

      width: 100%;
      height: 100vh;
      height: 100svh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* =========================================
       DARK LINE
    ========================================= */

    .dark-line {
      position: absolute;

      top: 50%;
      left: 0;

      width: 50%;
      height: 38px;

      transform: translateY(-50%);

      background: #080808;

      z-index: 1;

      pointer-events: none;
    }


    /* =========================================
       DARK CIRCLE
    ========================================= */

    .dark-circle {
      position: relative;

      width: 48vw;
      height: 48vw;

      max-width: 620px;
      max-height: 620px;

      min-width: 240px;
      min-height: 240px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at center,

          #050505 0%,
          #090909 65%,
          #111 85%,
          rgba(20, 20, 20, 0.95) 100%
        );

      box-shadow:
        0 0 50px rgba(0, 0, 0, 0.45);

      flex-shrink: 0;

      z-index: 2;

      cursor: pointer;

      transition:
        transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }


    .dark-circle:hover {
      transform: scale(1.015);
    }


    .dark-circle:active {
      transform: scale(0.99);
    }


    /* =========================================
       BUTTON SECTION
    ========================================= */

    .buttons-section {
      position: relative;

      width: 100%;

      min-height: 55vh;

      display: flex;
      align-items: flex-start;
      justify-content: center;

      padding-top: 18vh;
      padding-bottom: 15vh;

      overflow: hidden;
    }


    /* =========================================
       FIVE BUTTON CONTAINER

       Moderate spacing.
    ========================================= */

    .glass-buttons {
      position: relative;

      z-index: 5;

      width: min(820px, 92vw);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: clamp(18px, 2.5vw, 32px);
    }


    /* =========================================
       LIQUID GLASS BUTTON

       Small.
       Perfectly round.
       Transparent.
       No text.
    ========================================= */

    .glass-button {

      position: relative;

      display: block;

      width: clamp(72px, 8vw, 108px);

      aspect-ratio: 1 / 1;
      height: auto;

      flex: 0 1 auto;

      border-radius: 50%;

      background:
        rgba(255, 255, 255, 0.075);

      backdrop-filter:
        blur(4.5px)
        url(#lg-filter)
        blur(9px)
        saturate(1.5)
        brightness(1.1);

      -webkit-backdrop-filter:
        blur(36px)
        saturate(1.8)
        brightness(1.15)
        contrast(1.05);

      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.11),
        inset 1px 1px 0 rgba(255, 255, 255, 0.28),
        inset 0 0 10px rgba(255, 255, 255, 0.07),
        0 7px 26px rgba(0, 0, 0, 0.18);

      cursor: pointer;

      text-decoration: none;

      overflow: hidden;

      isolation: isolate;

      transition:
        transform 500ms cubic-bezier(0.22, 1, 0.36, 1),
        background 400ms ease,
        box-shadow 400ms ease;
    }


    /* =========================================
       TOP-RIGHT LIGHT EDGE
    ========================================= */

    .glass-button::before {

      content: "";

      position: absolute;

      inset: -1px;

      border-radius: 50%;

      pointer-events: none;

      background:
        conic-gradient(
          from 210deg,

          transparent 0deg,
          transparent 38deg,

          rgba(255, 255, 255, 0) 47deg,
          rgba(255, 255, 255, 0.13) 56deg,
          rgba(255, 255, 255, 0.42) 68deg,
          rgba(255, 255, 255, 0.55) 74deg,
          rgba(255, 255, 255, 0.18) 87deg,
          rgba(255, 255, 255, 0) 98deg,

          transparent 105deg,
          transparent 360deg
        );

      -webkit-mask:
        radial-gradient(
          circle,
          transparent calc(100% - 4px),
          #000 calc(100% - 2px),
          #000 100%
        );

      mask:
        radial-gradient(
          circle,
          transparent calc(100% - 4px),
          #000 calc(100% - 2px),
          #000 100%
        );

      filter: blur(0.4px);

      opacity: 0.85;
    }


    /* =========================================
       BOTTOM-LEFT LIGHT EDGE
    ========================================= */

    .glass-button::after {

      content: "";

      position: absolute;

      inset: -1px;

      border-radius: 50%;

      pointer-events: none;

      background:
        conic-gradient(
          from 30deg,

          transparent 0deg,
          transparent 38deg,

          rgba(255, 255, 255, 0) 48deg,
          rgba(235, 235, 210, 0.08) 57deg,
          rgba(255, 255, 255, 0.22) 68deg,
          rgba(255, 255, 255, 0.34) 75deg,
          rgba(255, 255, 255, 0.10) 88deg,
          rgba(255, 255, 255, 0) 99deg,

          transparent 106deg,
          transparent 360deg
        );

      -webkit-mask:
        radial-gradient(
          circle,
          transparent calc(100% - 4px),
          #000 calc(100% - 2px),
          #000 100%
        );

      mask:
        radial-gradient(
          circle,
          transparent calc(100% - 4px),
          #000 calc(100% - 2px),
          #000 100%
        );

      filter: blur(0.5px);

      opacity: 0.58;
    }


    /* =========================================
       HOVER
    ========================================= */

    .glass-button:hover {

      transform:
        translateY(-5px)
        scale(1.045);

      background:
        rgba(255, 255, 255, 0.10);

      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.15),
        inset 1px 1px 0 rgba(255, 255, 255, 0.34),
        inset 0 0 12px rgba(255, 255, 255, 0.09),
        0 13px 35px rgba(0, 0, 0, 0.25),
        0 0 20px rgba(255, 240, 170, 0.05);
    }


    /* =========================================
       ACTIVE
    ========================================= */

    .glass-button:active {

      transform:
        translateY(-1px)
        scale(0.96);

      box-shadow:
        inset 0 0 10px rgba(0, 0, 0, 0.10),
        0 4px 16px rgba(0, 0, 0, 0.20);
    }


    /* =========================================
       FOOTER
    ========================================= */

    .impressum {

      position: relative;

      padding-bottom: 8vh;

      text-align: center;

      font-family:
        "Space Grotesk",
        sans-serif;

      font-size: 14px;

      font-weight: 300;

      z-index: 5;
    }


    .impressum a {

      color:
        rgba(255, 255, 255, 0.45);

      text-decoration: none;

      transition:
        color 300ms ease;
    }


    .impressum a:hover {
      color: #fff;
    }


    /* =========================================
       TABLET
    ========================================= */

    @media (max-width: 900px) {

      .glass-buttons {

        width: 94vw;

        gap: 14px;
      }

      .glass-button {

        width: clamp(65px, 11vw, 90px);
      }

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      .page {

        background:
          radial-gradient(
            ellipse 160vw 160vw at 50% 50svh,

            rgba(255, 230, 100, 0.95) 0%,
            rgba(255, 228, 120, 0.78) 15%,
            rgba(248, 230, 165, 0.58) 30%,
            rgba(220, 218, 195, 0.38) 45%,
            rgba(170, 170, 165, 0.18) 60%,
            rgba(60, 60, 55, 0.40) 78%,
            rgba(0, 0, 0, 0.85) 94%,
            #000 100%
          );

        background-repeat: no-repeat;
        background-color: #000;
      }


      /* =====================================
         HERO
      ====================================== */

      .hero {

        width: 100%;
        height: 100svh;
      }


      /* =====================================
         MAIN CIRCLE
      ====================================== */

      .dark-circle {

        width: 68vw;
        height: 68vw;

        min-width: 0;
        min-height: 0;

        max-width: none;
        max-height: none;
      }


      /* =====================================
         DARK LINE
      ====================================== */

      .dark-line {

        width: 50%;
        height: 22px;

        transform: translateY(-50%);

        background: #080808;

        box-shadow: none;
      }


      /* =====================================
         BUTTON SECTION
      ====================================== */

      .buttons-section {

        min-height: 50vh;

        padding-top: 12vh;
        padding-bottom: 12vh;
      }


      /* =====================================
         FIVE SMALL CIRCLES

         Slightly more spacing than before.
      ====================================== */

      .glass-buttons {

        width: 94vw;

        gap: 11px;
      }


      .glass-button {

        width: 17vw;

        height: 17vw;

        max-width: 68px;
        max-height: 68px;

        min-width: 0;
        min-height: 0;

        flex: 0 1 17vw;

        aspect-ratio: 1 / 1;

        border-radius: 50%;
      }


      /* =====================================
         THINNER MOBILE RIM
      ====================================== */

      .glass-button::before,
      .glass-button::after {

        -webkit-mask:
          radial-gradient(
            circle,
            transparent calc(100% - 3px),
            #000 calc(100% - 1.7px),
            #000 100%
          );

        mask:
          radial-gradient(
            circle,
            transparent calc(100% - 3px),
            #000 calc(100% - 1.7px),
            #000 100%
          );
      }


      /* =====================================
         FOOTER
      ====================================== */

      .impressum {

        padding-bottom: 8vh;

        font-size: 13px;
      }

    }


    /* =========================================
       VERY SMALL PHONES
    ========================================= */

    @media (max-width: 380px) {

      .glass-buttons {

        width: 95vw;

        gap: 8px;
      }

      .glass-button {

        width: 17vw;
        height: 17vw;

        max-width: 58px;
        max-height: 58px;

        flex-basis: 17vw;
      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       SVG FILTER
  ========================================== -->

  <svg
    class="svg-filters"
    xmlns="http://www.w3.org/2000/svg"
  >

    <filter
      id="lg-filter"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >

      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012"
        numOctaves="2"
        seed="8"
        result="noise"
      />

      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="8"
        xChannelSelector="R"
        yChannelSelector="G"
      />

    </filter>

  </svg>


  <!-- =========================================
       PAGE
  ========================================== -->

  <main class="page">

    <div class="content">


      <!-- =====================================
           HERO
      ====================================== -->

      <section
        class="hero"
        id="top"
      >

        <div class="dark-line"></div>


        <div
          class="dark-circle"
          id="scrollCircle"
          role="button"
          tabindex="0"
          aria-label="Scroll down"
        ></div>

      </section>


      <!-- =====================================
           FIVE GLASS BUTTONS
           
           Completely empty.
      ====================================== -->

      <section
        class="buttons-section"
        id="buttons"
      >

        <div class="glass-buttons">


          <a
            href="/page1.html"
            class="glass-button"
            aria-label="Page 1"
          ></a>


          <a
            href="/page2.html"
            class="glass-button"
            aria-label="Page 2"
          ></a>


          <a
            href="/page3.html"
            class="glass-button"
            aria-label="Page 3"
          ></a>


          <a
            href="/page4.html"
            class="glass-button"
            aria-label="Page 4"
          ></a>


          <a
            href="/page5.html"
            class="glass-button"
            aria-label="Page 5"
          ></a>


        </div>

      </section>


      <!-- =====================================
           FOOTER
      ====================================== -->

      <div class="impressum">

        <a href="/moviesforyounme.html">
          Movies
        </a>

      </div>


    </div>

  </main>


  <!-- =========================================
       SCROLL INTERACTION
  ========================================== -->

  <script>

    const circle =
      document.getElementById("scrollCircle");


    function scrollDown() {

      const buttons =
        document.getElementById("buttons");

      buttons.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }


    /* =========================================
       MOUSE / TOUCH
    ========================================== */

    circle.addEventListener(
      "click",
      scrollDown
    );


    /* =========================================
       KEYBOARD
    ========================================== */

    circle.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();

          scrollDown();

        }

      }
    );

  </script>

</body>
</html>
