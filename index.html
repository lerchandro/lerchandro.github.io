<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            overflow-x: hidden;
            background: black;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* PHONE */
        @media (max-width: 600px) {
        img {
        width: auto;
        height: 100vh;
        max-width: none;

        position: relative;
        left: 0;
        transform: none;
        }
    }
    </style>
</head>

<body>

    <img src="bp.jpg" alt="Lamp">

</body>
</html>
