<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Light Scroll</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      overflow-x: hidden;
      background: #000;
    }


    /* =========================================
       PAGE
    ========================================= */

    .page {
      position: relative;

      width: 100%;
      min-height: 100vh;

      /*
        THE GRADIENT IS DIRECTLY ON THE PAGE.
        It fades from light in the center
        into black as you scroll away.
      */

      background:
        radial-gradient(
          ellipse 110vw 110vw at 50% 50vh,

          rgba(255, 230, 100, 0.95) 0%,
          rgba(255, 228, 120, 0.78) 15%,
          rgba(248, 230, 165, 0.58) 30%,
          rgba(220, 218, 195, 0.38) 45%,
          rgba(170, 170, 165, 0.18) 60%,
          rgba(60, 60, 55, 0.40) 78%,
          rgba(0, 0, 0, 0.85) 94%,
          #000 100%
        );

      background-repeat: no-repeat;
      background-color: #000;
    }


    /* =========================================
       CONTENT
    ========================================= */

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
    }


    /* =========================================
       FIRST SECTION
    ========================================= */

    .hero {
      position: relative;

      width: 100%;

      height: 100vh;
      height: 100svh;

      display: flex;

      align-items: center;
      justify-content: center;

      overflow: hidden;
    }


    /* =========================================
       DARK LINE
       LEFT EDGE → CENTER OF CIRCLE
    ========================================= */

    .dark-line {
      position: absolute;

      top: 50%;
      left: 0;

      width: 50%;
      height: 38px;

      transform: translateY(-50%);

      background: #080808;

      z-index: 1;

      pointer-events: none;
    }


    /* =========================================
       DARK CIRCLE
    ========================================= */

    .dark-circle {
      position: relative;

      width: 48vw;
      height: 48vw;

      max-width: 620px;
      max-height: 620px;

      min-width: 240px;
      min-height: 240px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at center,

          #050505 0%,
          #090909 65%,
          #111 85%,
          rgba(20, 20, 20, 0.95) 100%
        );

      box-shadow:
        0 0 50px rgba(0, 0, 0, 0.45);

      flex-shrink: 0;

      z-index: 2;
    }


    /* =========================================
       LONG DARK SCROLL SPACE

       This replaces the old image.

       300vh = approximately 3 full
       additional screen heights of scrolling.
    ========================================= */

    .dark-space {
      width: 100%;

      height: 300vh;

      background: transparent;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 600px) {

      .page {
        background:
          radial-gradient(
            ellipse 160vw 160vw at 50% 50svh,

            rgba(255, 230, 100, 0.95) 0%,
            rgba(255, 228, 120, 0.78) 15%,
            rgba(248, 230, 165, 0.58) 30%,
            rgba(220, 218, 195, 0.38) 45%,
            rgba(170, 170, 165, 0.18) 60%,
            rgba(60, 60, 55, 0.40) 78%,
            rgba(0, 0, 0, 0.85) 94%,
            #000 100%
          );

        background-repeat: no-repeat;
        background-color: #000;
      }


      /* -----------------------------------------
         FIRST SCREEN
      ----------------------------------------- */

      .hero {
        width: 100%;
        height: 100svh;
      }


      /* -----------------------------------------
         CIRCLE
      ----------------------------------------- */

      .dark-circle {
        width: 68vw;
        height: 68vw;

        min-width: 0;
        min-height: 0;

        max-width: none;
        max-height: none;

        border-radius: 50%;
      }


      /* -----------------------------------------
         LINE
      ----------------------------------------- */

      .dark-line {
        width: 50%;

        height: 22px;

        transform: translateY(-50%);

        background: #080808;

        box-shadow: none;
      }


      /* -----------------------------------------
         LONG DARK SPACE
      ----------------------------------------- */

      .dark-space {
        width: 100%;

        height: 300vh;

        background: transparent;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <div class="content">


      <!-- =====================================
           DARK CIRCLE + HORIZONTAL LINE
      ====================================== -->

      <section class="hero">

        <div class="dark-line"></div>

        <div class="dark-circle"></div>

      </section>


      <!-- =====================================
           LONG EMPTY DARK SPACE
      ====================================== -->

      <section class="dark-space"></section>


    </div>

  </main>

</body>
</html>
