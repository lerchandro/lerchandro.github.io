<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            overflow-x: hidden;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <img src="bp.jpg" alt="Lamp">

</body>
</html>
