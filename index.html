<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lerchandro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

       body {
    min-height: 100vh;
    margin: 0;

    font-family: Arial, Helvetica, sans-serif;
    color: white;

    background-image: url("bb.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;

    overflow-x: hidden;
    }
        /* Main */
        .page {
            min-height: 100vh;
            max-width: 1100px;
            margin: auto;
            padding: 70px 55px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Profile */
        .profile {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .profile-picture {
            width: 230px;
            height: 230px;

            border-radius: 50%;
            object-fit: cover;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.45);

            border: 1px solid rgba(255,255,255,0.12);
        }

        .profile-info {
            display: flex;
            flex-direction: column;
        }

        .profile-label {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ddd9d2;
        }

        h1 {
            font-size: clamp(55px, 9vw, 100px);
            line-height: 0.9;

            font-weight: 800;
            letter-spacing: -6px;

            color: #ffffff;
        }

        /* Social links */
        .links {
            display: flex;
            gap: 14px;

            margin-left: 265px;
            margin-top: 35px;

            flex-wrap: wrap;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 125px;

            padding: 14px 25px;

            border-radius: 50px;

            color: white;
            text-decoration: none;

            font-size: 16px;
            font-weight: 700;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);

            backdrop-filter: blur(10px);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                color 0.25s ease;
        }

        .links a:hover {
            transform: translateY(-5px);

            background: white;
            color: #292825;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.25);
        }

        /* Bottom line */
        .line {
            width: 100%;
            height: 1px;

            margin-top: 70px;

            background: rgba(255,255,255,0.15);
        }

        /* Mobile */
        @media (max-width: 700px) {

            .page {
                padding: 45px 25px;
                justify-content: center;
            }

            .profile {
                flex-direction: column;
                align-items: flex-start;
                gap: 25px;
            }

            .profile-picture {
                width: 170px;
                height: 170px;
            }

            h1 {
                font-size: 58px;
                letter-spacing: -4px;
            }

            .links {
                margin-left: 0;
                margin-top: 30px;
            }

            .links a {
                min-width: 110px;
                padding: 13px 20px;
            }

            .line {
                margin-top: 50px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="profile">

            <img
                src="pp.jpg"
                alt="Lerchandro"
                class="profile-picture"
            >

            <div class="profile-info">

                <h1>
                    Lerchandro
                </h1>

            </div>

        </section>


        <nav class="links">

            <a
                href="https://open.spotify.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Spotify
            </a>

            <a
                href="https://www.pinterest.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Pinterest
            </a>

            <a
                href="https://www.instagram.com/"
                target="_blank"
                rel="noopener noreferrer"
            >
                Instagram
            </a>

        </nav>


        <div class="line"></div>

    </main>

</body>
</html>
