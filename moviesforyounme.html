
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Movies</title>

  <!-- Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #000;
      color: #fff;

      font-family: "Space Grotesk", sans-serif;
      font-weight: 300;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

  
.text {
  width: 80vw;
  max-width: 900px;

  text-align: center;

  font-family: "Space Grotesk", sans-serif;
  font-size: clamp(20px, 2vw, 36px);
  font-weight: 300;
  line-height: 1.2;
  letter-spacing: -0.03em;
}

.text a {
  display: block;

  color: #fff;
  text-decoration: none;

  transition: opacity 200ms ease;
}

.text a:hover {
  opacity: 0.5;
}
  </style>
</head>

<body>
 <div class="text">
  <a
    href="https://letterboxd.com/film/ferris-buellers-day-off/"
    target="_blank"
    rel="noopener noreferrer"
  >
    Ferris Bueller's Day Off
  </a>

  <a
    href="https://letterboxd.com/film/whiplash-2014/"
    target="_blank"
    rel="noopener noreferrer"
  >
    Whiplash
  </a>

  <a
    href="https://letterboxd.com/film/the-holdovers/"
    target="_blank"
    rel="noopener noreferrer"
  >
    The Holdovers
  </a>
</div>

</body>
</html>
