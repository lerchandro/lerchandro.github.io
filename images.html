
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#000000">
<title>White Glass Image Viewer</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    overscroll-behavior: none;
    touch-action: manipulation;
}

/* WHITE GRADIENT BACKGROUND */

body {
    background:
        radial-gradient(
            ellipse 72% 75% at 50% 8%,
            #ffffff 0%,
            #e8e8e8 22%,
            #bdbdbd 42%,
            #555555 66%,
            #000000 100%
        );

    border: 1px solid rgba(255, 255, 255, 0.12);
}

/* MAIN VIEWER */

.viewer {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(24px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(32px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
}

/* IMAGE */

.image-container {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
}

.image {
    display: block;

    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
    object-position: center;

    border-radius: 2px;

    user-select: none;
    -webkit-user-drag: none;

    box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.20);
}

/* WHITE GLASS ARROW BUTTONS */

.glass-button {
    width: 78px;
    height: 78px;
    flex: 0 0 78px;

    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;
    border: none;
    outline: none;
    border-radius: 50%;

    background: rgba(255, 255, 255, 0.12);

    box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.12),
        inset 0 -2px 4px rgba(0, 0, 0, 0.06),
        0 3px 12px rgba(0, 0, 0, 0.08);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    color: rgba(255, 255, 255, 0.95);
    font-size: 29px;
    font-family: Arial, sans-serif;
    font-weight: 300;
    line-height: 1;

    cursor: pointer;
    touch-action: manipulation;

    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;

    transition: background 0.18s ease;
}

/* SUBTLE SEGMENTED WHITE RIM */

.glass-button::before {
    content: "";
    position: absolute;
    inset: -1px;

    border-radius: 50%;

    background: conic-gradient(
        from 125deg,
        transparent 0deg,
        transparent 35deg,
        rgba(255, 255, 255, 0.08) 52deg,
        rgba(255, 255, 255, 0.30) 72deg,
        rgba(255, 255, 255, 0.60) 88deg,
        rgba(255, 255, 255, 0.12) 108deg,
        transparent 135deg,
        transparent 205deg,
        rgba(255, 255, 255, 0.10) 225deg,
        rgba(255, 255, 255, 0.28) 248deg,
        rgba(255, 255, 255, 0.50) 268deg,
        rgba(255, 255, 255, 0.08) 288deg,
        transparent 315deg,
        transparent 360deg
    );

    -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 1.7px),
        #000 calc(100% - 0.9px),
        #000 100%
    );

    mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 1.7px),
        #000 calc(100% - 0.9px),
        #000 100%
    );

    pointer-events: none;
}

/* SUBTLE OUTER GLOW */

.glass-button::after {
    content: "";
    position: absolute;
    inset: -1px;

    border-radius: 50%;

    box-shadow:
        7px -5px 9px rgba(255, 255, 255, 0.045),
        -7px 5px 9px rgba(255, 255, 255, 0.025);

    pointer-events: none;
}

/* BUTTON POSITIONS */

#prev {
    left: max(18px, env(safe-area-inset-left));
}

#next {
    right: max(18px, env(safe-area-inset-right));
}

/* HOVER: LIGHTEN ONLY, NO MOVEMENT */

.glass-button:hover {
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.20);
}

/* PRESS: VERY SLIGHT DARKENING, NO MOVEMENT */

.glass-button:active {
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.08);
}

.glass-button:focus-visible {
    outline: 1px solid rgba(255, 255, 255, 0.6);
    outline-offset: 3px;
}

/* IMAGE COUNTER */

.counter {
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;

    padding: 7px 12px;

    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;

    background: rgba(255, 255, 255, 0.08);

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    color: rgba(255, 255, 255, 0.8);
    font-size: 12px;
    letter-spacing: 1px;

    pointer-events: none;
}

/* PORTRAIT SCREENS */

@media (orientation: portrait) {
    .viewer {
        padding-top: max(36px, env(safe-area-inset-top));
        padding-bottom: max(44px, env(safe-area-inset-bottom));
        padding-left: max(12px, env(safe-area-inset-left));
        padding-right: max(12px, env(safe-area-inset-right));
    }

    .glass-button {
        width: 60px;
        height: 60px;
        flex-basis: 60px;
        font-size: 24px;
    }

    #prev {
        left: max(10px, env(safe-area-inset-left));
    }

    #next {
        right: max(10px, env(safe-area-inset-right));
    }
}

/* LANDSCAPE SCREENS */

@media (orientation: landscape) {
    .viewer {
        padding-top: max(28px, env(safe-area-inset-top));
        padding-bottom: max(36px, env(safe-area-inset-bottom));
        padding-left: max(90px, env(safe-area-inset-left));
        padding-right: max(90px, env(safe-area-inset-right));
    }
}

/* SMALL PHONES */

@media (max-width: 360px) and (orientation: portrait) {
    .glass-button {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
        font-size: 21px;
    }

    #prev {
        left: 5px;
    }

    #next {
        right: 5px;
    }
}

/* REDUCE MOTION */

@media (prefers-reduced-motion: reduce) {
    .glass-button {
        transition: none;
    }
}
</style>
</head>

<body>

<main class="viewer">
    <div class="image-container">
        <img
            class="image"
            id="image"
            src="image01.jpg"
            alt="Image"
            draggable="false"
        >
    </div>
</main>

<button
    class="glass-button"
    id="prev"
    aria-label="Previous image"
    type="button">&#10094;</button>

<button
    class="glass-button"
    id="next"
    aria-label="Next image"
    type="button">&#10095;</button>

<div class="counter" id="counter">1 / 2</div>

<script>
const images = [
    "image01.jpg",
    "image02.jpg"
];

let current = 0;

const image = document.getElementById("image");
const counter = document.getElementById("counter");

function showImage(index) {
    current = (index + images.length) % images.length;

    image.src = images[current];
    counter.textContent = `${current + 1} / ${images.length}`;
}

function nextImage() {
    showImage(current + 1);
}

function prevImage() {
    showImage(current - 1);
}

/* BUTTON NAVIGATION */

document.getElementById("next").addEventListener("click", nextImage);
document.getElementById("prev").addEventListener("click", prevImage);

/* KEYBOARD NAVIGATION */

document.addEventListener("keydown", event => {
    if (event.key === "ArrowRight") {
        nextImage();
    } else if (event.key === "ArrowLeft") {
        prevImage();
    }
});

/* SWIPE NAVIGATION */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener("touchstart", event => {
    if (!event.changedTouches.length) return;

    touchStartX = event.changedTouches[0].screenX;
    touchStartY = event.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener("touchend", event => {
    if (!event.changedTouches.length) return;

    const dx = event.changedTouches[0].screenX - touchStartX;
    const dy = event.changedTouches[0].screenY - touchStartY;

    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) {
            nextImage();
        } else {
            prevImage();
        }
    }
}, { passive: true });

/* INITIALIZE */

showImage(0);
</script>

</body>
</html>
