
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
               user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#000000">
<title>Green Glass Image Viewer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    overscroll-behavior: none;
}

body {
    background: radial-gradient(
        ellipse 72% 75% at 50% 8%,
        #5b5e43 0%,
        #474a34 22%,
        #2e3022 42%,
        #151610 66%,
        #000000 100%
    );
}

/* VIEWER */

.viewer {
    position: relative;
    width: 100%;
    height: 100%;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(24px, env(safe-area-inset-top))
        max(28px, env(safe-area-inset-right))
        max(32px, env(safe-area-inset-bottom))
        max(28px, env(safe-area-inset-left));
}

/* IMAGE */

.image-container {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;

    display: flex;
    align-items: center;
    justify-content: center;
}

.image {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;

    object-fit: contain;
    border-radius: 2px;

    position: relative;
    z-index: 20;

    cursor: zoom-in;
    user-select: none;
    -webkit-user-drag: none;

    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.20);
}

/* COUNTER — ALWAYS BELOW THE IMAGE */

.counter {
    position: fixed;
    z-index: 5;

    bottom: max(12px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);

    padding: 7px 12px;
    border: 1px solid rgba(220, 225, 180, 0.08);
    border-radius: 20px;

    background: rgba(25, 27, 19, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    color: rgba(235, 238, 210, 0.75);
    font-size: 12px;
    letter-spacing: 1px;

    pointer-events: none;
}

/* GLASS ARROW BUTTONS */

.glass-button {
    width: 78px;
    height: 78px;
    flex: 0 0 78px;

    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 30;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;
    border: none;
    outline: none;
    border-radius: 50%;

    background: rgba(76, 80, 55, 0.38);

    box-shadow:
        inset 0 1px 2px rgba(220, 225, 180, 0.035),
        inset 0 -2px 4px rgba(0, 0, 0, 0.12),
        0 3px 12px rgba(0, 0, 0, 0.10);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    color: rgba(235, 238, 210, 0.92);
    font-family: Arial, sans-serif;
    font-size: 29px;
    font-weight: 300;
    line-height: 1;

    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;

    transition: background 0.18s ease;
}

/* SEGMENTED OUTER RIM */

.glass-button::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;

    background: conic-gradient(
        from 125deg,
        transparent 0deg,
        transparent 35deg,
        rgba(205, 213, 160, 0.05) 52deg,
        rgba(215, 222, 170, 0.20) 72deg,
        rgba(225, 230, 185, 0.34) 88deg,
        rgba(180, 190, 140, 0.08) 108deg,
        transparent 135deg,
        transparent 205deg,
        rgba(185, 195, 145, 0.07) 225deg,
        rgba(215, 220, 170, 0.18) 248deg,
        rgba(225, 230, 185, 0.30) 268deg,
        rgba(170, 180, 130, 0.05) 288deg,
        transparent 315deg,
        transparent 360deg
    );

    -webkit-mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 1.7px),
        #000 calc(100% - 0.9px),
        #000 100%
    );

    mask: radial-gradient(
        farthest-side,
        transparent calc(100% - 1.7px),
        #000 calc(100% - 0.9px),
        #000 100%
    );

    pointer-events: none;
}

/* SUBTLE OUTER GLOW */

.glass-button::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 50%;

    box-shadow:
        7px -5px 9px rgba(190, 200, 145, 0.035),
        -7px 5px 9px rgba(190, 200, 145, 0.025);

    pointer-events: none;
}

/* BUTTON POSITIONS */

#prev {
    left: max(18px, env(safe-area-inset-left));
}

#next {
    right: max(18px, env(safe-area-inset-right));
}

/* LIGHTEN ON HOVER WITHOUT MOVEMENT */

.glass-button:hover {
    transform: translateY(-50%);
    background: rgba(100, 105, 72, 0.48);
}

.glass-button:active {
    transform: translateY(-50%);
    background: rgba(65, 69, 48, 0.42);
}

.glass-button:focus-visible {
    outline: 1px solid rgba(225, 230, 185, 0.4);
    outline-offset: 3px;
}

/* PORTRAIT */

@media (orientation: portrait) {
    .viewer {
        padding-top: max(36px, env(safe-area-inset-top));
        padding-bottom: max(44px, env(safe-area-inset-bottom));
        padding-left: 12px;
        padding-right: 12px;
    }

    .glass-button {
        width: 60px;
        height: 60px;
        flex-basis: 60px;
        font-size: 24px;
    }

    #prev {
        left: max(10px, env(safe-area-inset-left));
    }

    #next {
        right: max(10px, env(safe-area-inset-right));
    }
}

/* LANDSCAPE */

@media (orientation: landscape) {
    .viewer {
        padding-top: max(28px, env(safe-area-inset-top));
        padding-bottom: max(36px, env(safe-area-inset-bottom));
        padding-left: max(90px, env(safe-area-inset-left));
        padding-right: max(90px, env(safe-area-inset-right));
    }
}

/* SMALL PHONES */

@media (max-width: 360px) and (orientation: portrait) {
    .glass-button {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
        font-size: 21px;
    }

    #prev {
        left: 5px;
    }

    #next {
        right: 5px;
    }
}

/* HIDE NAVIGATION BUTTONS ON MOBILE / TOUCH DEVICES */

@media (max-width: 600px), (hover: none) and (pointer: coarse) {
    .glass-button {
        display: none;
    }
}

/* FULLSCREEN IMAGE OVERLAY */

.fullscreen {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: none;
    align-items: center;
    justify-content: center;

    padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));

    background: rgba(0, 0, 0, 0.96);
    cursor: zoom-out;
    touch-action: manipulation;
}

.fullscreen.active {
    display: flex;
}

.fullscreen img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;

    user-select: none;
    -webkit-user-drag: none;
}

.fullscreen-hint {
    position: absolute;
    bottom: max(18px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);

    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    white-space: nowrap;
    pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
    .glass-button {
        transition: none;
    }
}
</style>
</head>

<body>

<main class="viewer">
    <div class="image-container">
        <img
            class="image"
            id="image"
            src="image01.jpg"
            alt="Image 1"
            draggable="false"
            title="Click to view fullscreen"
        >
    </div>
</main>

<button
    class="glass-button"
    id="prev"
    aria-label="Previous image"
    type="button">&#10094;</button>

<button
    class="glass-button"
    id="next"
    aria-label="Next image"
    type="button">&#10095;</button>

<div class="counter" id="counter">1 / 2</div>

<!-- FULLSCREEN VIEW -->

<div
    class="fullscreen"
    id="fullscreen"
    role="dialog"
    aria-label="Fullscreen image viewer"
    aria-modal="true">

    <img id="fullscreenImage" src="image01.jpg" alt="Fullscreen image">

    <div class="fullscreen-hint">
       
    </div>
</div>

<script>
const images = [
    "image01.jpg",
    "image02.jpg"
];

let current = 0;

const image = document.getElementById("image");
const counter = document.getElementById("counter");

const fullscreen = document.getElementById("fullscreen");
const fullscreenImage = document.getElementById("fullscreenImage");

function showImage(index) {
    current = (index + images.length) % images.length;

    image.src = images[current];
    image.alt = `Image ${current + 1}`;

    counter.textContent = `${current + 1} / ${images.length}`;

    if (fullscreen.classList.contains("active")) {
        fullscreenImage.src = images[current];
        fullscreenImage.alt = `Image ${current + 1}, fullscreen`;
    }
}

function nextImage() {
    showImage(current + 1);
}

function prevImage() {
    showImage(current - 1);
}

/* DESKTOP ARROW BUTTONS */

document.getElementById("next").addEventListener("click", nextImage);
document.getElementById("prev").addEventListener("click", prevImage);

/* KEYBOARD NAVIGATION */

document.addEventListener("keydown", event => {
    if (event.key === "ArrowRight") {
        nextImage();
    } else if (event.key === "ArrowLeft") {
        prevImage();
    } else if (event.key === "Escape") {
        closeFullscreen();
    }
});

/* OPEN FULLSCREEN BY CLICKING IMAGE */

image.addEventListener("click", openFullscreen);

function openFullscreen() {
    fullscreenImage.src = images[current];
    fullscreenImage.alt = `Image ${current + 1}, fullscreen`;

    fullscreen.classList.add("active");

    if (fullscreen.requestFullscreen) {
        fullscreen.requestFullscreen().catch(() => {});
    }
}

/* CLOSE FULLSCREEN */

function closeFullscreen() {
    fullscreen.classList.remove("active");

    if (document.fullscreenElement && document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
    }
}

fullscreen.addEventListener("click", closeFullscreen);

fullscreenImage.addEventListener("click", event => {
    event.stopPropagation();
    closeFullscreen();
});

/* SYNC IF USER EXITS NATIVE FULLSCREEN */

document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement) {
        fullscreen.classList.remove("active");
    }
});

/* SWIPE NAVIGATION ON THE MAIN VIEWER */

let touchStartX = 0;
let touchStartY = 0;

document.addEventListener("touchstart", event => {
    if (!event.changedTouches.length) return;

    touchStartX = event.changedTouches[0].screenX;
    touchStartY = event.changedTouches[0].screenY;
}, { passive: true });

document.addEventListener("touchend", event => {
    if (!event.changedTouches.length) return;

    /* Don't navigate when swiping inside fullscreen */
    if (fullscreen.classList.contains("active")) return;

    const dx = event.changedTouches[0].screenX - touchStartX;
    const dy = event.changedTouches[0].screenY - touchStartY;

    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) {
            nextImage();
        } else {
            prevImage();
        }
    }
}, { passive: true });

/* INITIALIZE */

showImage(0);
</script>

</body>
</html>
