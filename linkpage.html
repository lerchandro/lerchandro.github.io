<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no"
>

<title>Glass Green UI</title>

<style>

/* =========================
   RESET
   ========================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}


/* =========================
   BACKGROUND
   ========================= */

body {
    background:
        radial-gradient(
            ellipse 72% 75% at 50% 8%,
            #5b5e43 0%,
            #474a34 22%,
            #2e3022 42%,
            #151610 66%,
            #000000 100%
        );

    border: 1px solid rgba(255, 255, 255, 0.22);

    font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   CENTER
   ========================= */

.stage {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================
   BUTTON ROW
   ========================= */

.buttons {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: clamp(42px, 5.65vw, 55px);

    transform: translateY(13px);
}


/* =========================
   GLASS BUTTON
   ========================= */

.glass-button {
    width: 78px;
    height: 78px;

    flex: 0 0 78px;

    position: relative;

    border: none;
    outline: none;

    border-radius: 50%;

    /*
       FLAT INTERIOR
    */
    background: rgba(76, 80, 55, 0.38);

    /*
       VERY SUBTLE DEPTH
    */
    box-shadow:
        inset 0 1px 2px rgba(220, 225, 180, 0.035),
        inset 0 -2px 4px rgba(0, 0, 0, 0.12),
        0 3px 12px rgba(0, 0, 0, 0.10);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    overflow: visible;

    cursor: pointer;

    transition:
        transform 0.18s ease,
        background 0.18s ease;
}


/* =========================
   OUTER EDGE ONLY
   ========================= */

.glass-button::before {
    content: "";

    position: absolute;

    inset: -1px;

    border-radius: 50%;

    background:
        conic-gradient(
            from 125deg,

            transparent 0deg,
            transparent 35deg,

            rgba(205, 213, 160, 0.05) 52deg,
            rgba(215, 222, 170, 0.20) 72deg,
            rgba(225, 230, 185, 0.34) 88deg,

            rgba(180, 190, 140, 0.08) 108deg,

            transparent 135deg,
            transparent 205deg,

            rgba(185, 195, 145, 0.07) 225deg,
            rgba(215, 220, 170, 0.18) 248deg,
            rgba(225, 230, 185, 0.30) 268deg,

            rgba(170, 180, 130, 0.05) 288deg,

            transparent 315deg,
            transparent 360deg
        );

    /*
       THIN OUTER RING
    */
    -webkit-mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 1.7px),
            #000 calc(100% - 0.9px),
            #000 100%
        );

    mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 1.7px),
            #000 calc(100% - 0.9px),
            #000 100%
        );

    pointer-events: none;
}


/* =========================
   VERY SUBTLE OUTER GLOW
   ========================= */

.glass-button::after {
    content: "";

    position: absolute;

    inset: -1px;

    border-radius: 50%;

    box-shadow:
        7px -5px 9px rgba(190, 200, 145, 0.035),
        -7px 5px 9px rgba(190, 200, 145, 0.025);

    pointer-events: none;
}


/* =========================
   HOVER
   ========================= */

.glass-button:hover {
    transform: translateY(-2px);

    background: rgba(82, 87, 59, 0.40);
}


/* =========================
   CLICK
   ========================= */

.glass-button:active {
    transform: translateY(0) scale(0.97);
}


/* =========================
   FOCUS
   ========================= */

.glass-button:focus,
.glass-button:focus-visible {
    outline: none;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    body {
        background:
            radial-gradient(
                ellipse 115% 62% at 50% 8%,
                #5b5e43 0%,
                #474a34 25%,
                #2d3021 48%,
                #11120e 74%,
                #000000 100%
            );
    }

    .buttons {
        width: 100%;

        padding: 0 18px;

        gap: clamp(7px, 2.4vw, 14px);

        transform: translateY(5px);
    }

    .glass-button {
        width: clamp(54px, 15vw, 68px);
        height: clamp(54px, 15vw, 68px);

        flex-basis: clamp(54px, 15vw, 68px);
    }
}


/* =========================
   SMALL PHONES
   ========================= */

@media (max-width: 360px) {

    .buttons {
        padding: 0 10px;
        gap: 5px;
    }

    .glass-button {
        width: 52px;
        height: 52px;

        flex-basis: 52px;
    }
}

</style>
</head>


<body>

<main class="stage">

    <div class="buttons">

        <!-- BUTTON 1 -->
        <button
            class="glass-button"
            aria-label="Button 1"
            data-number="1">
        </button>

        <!-- BUTTON 2 -->
        <button
            class="glass-button"
            aria-label="Button 2"
            data-number="2">
        </button>

        <!-- BUTTON 3 -->
        <button
            class="glass-button"
            aria-label="Button 3"
            data-number="3">
        </button>

        <!-- BUTTON 4 -->
        <button
            class="glass-button"
            aria-label="Button 4"
            data-number="4">
        </button>

        <!-- BUTTON 5 -->
        <button
            class="glass-button"
            aria-label="Button 5"
            data-number="5">
        </button>

    </div>

</main>


<script>

/* =========================
   SECRET COMBINATION
   ========================= */

const secretCode = "12344";


/* =========================
   CURRENT SEQUENCE
   ========================= */

let sequence = "";


/* =========================
   GET ALL BUTTONS
   ========================= */

const buttons = document.querySelectorAll(".glass-button");


/* =========================
   BUTTON HANDLERS
   ========================= */

buttons.forEach(button => {

    button.addEventListener("click", () => {

        /*
           Add the hidden number assigned
           to this button.
        */
        sequence += button.dataset.number;


        /*
           CORRECT COMBINATION
        */
        if (sequence === secretCode) {

            window.location.href = "index.html";

            return;
        }


        /*
           If the sequence can no longer
           become the secret code, reset it.
        */
        if (!secretCode.startsWith(sequence)) {

            sequence = "";

        }

    });

});

</script>

</body>
</html>
