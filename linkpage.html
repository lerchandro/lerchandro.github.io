<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
             maximum-scale=1.0, user-scalable=no,
             viewport-fit=cover"
>

<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Glass Green UI</title>

<style>

/* =========================
   RESET
   ========================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    background: #000000;

    touch-action: manipulation;
}


/* =========================
   BACKGROUND
   ========================= */

body {
    background:
        radial-gradient(
            ellipse 72% 75% at 50% 8%,
            #5b5e43 0%,
            #474a34 22%,
            #2e3022 42%,
            #151610 66%,
            #000000 100%
        );

    border: 1px solid rgba(255, 255, 255, 0.22);

    font-family: Arial, Helvetica, sans-serif;

    /*
       Helps prevent the page from
       creating a white overscroll area.
    */
    overscroll-behavior: none;
}


/* =========================
   CENTER
   ========================= */

.stage {
    width: 100%;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    touch-action: manipulation;
}


/* =========================
   BUTTON ROW
   ========================= */

.buttons {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: clamp(42px, 5.65vw, 55px);

    transform: translateY(13px);

    touch-action: manipulation;
}


/* =========================
   GLASS BUTTON
   ========================= */

.glass-button {
    width: 78px;
    height: 78px;

    flex: 0 0 78px;

    position: relative;

    border: none;
    outline: none;

    border-radius: 50%;

    /*
       Prevent double-tap zoom
       on mobile browsers.
    */
    touch-action: manipulation;

    /*
       FLAT INTERIOR
    */
    background: rgba(76, 80, 55, 0.38);

    /*
       VERY SUBTLE DEPTH
    */
    box-shadow:
        inset 0 1px 2px rgba(220, 225, 180, 0.035),
        inset 0 -2px 4px rgba(0, 0, 0, 0.12),
        0 3px 12px rgba(0, 0, 0, 0.10);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    overflow: visible;

    cursor: pointer;

    /*
       Prevent text selection
       during rapid presses.
    */
    user-select: none;
    -webkit-user-select: none;

    /*
       Prevent touch highlighting.
    */
    -webkit-tap-highlight-color: transparent;

    transition:
        transform 0.18s ease,
        background 0.18s ease;
}


/* =========================
   OUTER EDGE ONLY
   ========================= */

.glass-button::before {
    content: "";

    position: absolute;

    inset: -1px;

    border-radius: 50%;

    background:
        conic-gradient(
            from 125deg,

            transparent 0deg,
            transparent 35deg,

            rgba(205, 213, 160, 0.05) 52deg,
            rgba(215, 222, 170, 0.20) 72deg,
            rgba(225, 230, 185, 0.34) 88deg,

            rgba(180, 190, 140, 0.08) 108deg,

            transparent 135deg,
            transparent 205deg,

            rgba(185, 195, 145, 0.07) 225deg,
            rgba(215, 220, 170, 0.18) 248deg,
            rgba(225, 230, 185, 0.30) 268deg,

            rgba(170, 180, 130, 0.05) 288deg,

            transparent 315deg,
            transparent 360deg
        );

    /*
       THIN OUTER RING
    */
    -webkit-mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 1.7px),
            #000 calc(100% - 0.9px),
            #000 100%
        );

    mask:
        radial-gradient(
            farthest-side,
            transparent calc(100% - 1.7px),
            #000 calc(100% - 0.9px),
            #000 100%
        );

    pointer-events: none;
}


/* =========================
   VERY SUBTLE OUTER GLOW
   ========================= */

.glass-button::after {
    content: "";

    position: absolute;

    inset: -1px;

    border-radius: 50%;

    box-shadow:
        7px -5px 9px rgba(190, 200, 145, 0.035),
        -7px 5px 9px rgba(190, 200, 145, 0.025);

    pointer-events: none;
}


/* =========================
   HOVER
   ========================= */

.glass-button:hover {
    transform: translateY(-2px);

    background: rgba(82, 87, 59, 0.40);
}


/* =========================
   CLICK
   ========================= */

.glass-button:active {
    transform: translateY(0) scale(0.97);
}


/* =========================
   FOCUS
   ========================= */

.glass-button:focus,
.glass-button:focus-visible {
    outline: none;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    body {
        min-height: 100dvh;

        background:
            radial-gradient(
                ellipse 115% 62% at 50% 8%,
                #5b5e43 0%,
                #474a34 25%,
                #2d3021 48%,
                #11120e 74%,
                #000000 100%
            );
    }

    .stage {
        width: 100%;
        height: 100dvh;
    }

    .buttons {
        width: 100%;

        padding: 0 18px;

        gap: clamp(7px, 2.4vw, 14px);

        transform: translateY(5px);
    }

    .glass-button {
        width: clamp(54px, 15vw, 68px);
        height: clamp(54px, 15vw, 68px);

        flex-basis: clamp(54px, 15vw, 68px);
    }
}


/* =========================
   SMALL PHONES
   ========================= */

@media (max-width: 360px) {

    .buttons {
        padding: 0 10px;
        gap: 5px;
    }

    .glass-button {
        width: 52px;
        height: 52px;

        flex-basis: 52px;
    }
}


/* =========================
   SAFE AREA
   ========================= */

@supports (padding: env(safe-area-inset-top)) {

    .stage {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
    }

}

</style>
</head>


<body>

<main class="stage">

    <div class="buttons">

        <!-- BUTTON 1 -->
        <button
            class="glass-button"
            aria-label="Button 1"
            data-number="1">
        </button>

        <!-- BUTTON 2 -->
        <button
            class="glass-button"
            aria-label="Button 2"
            data-number="2">
        </button>

        <!-- BUTTON 3 -->
        <button
            class="glass-button"
            aria-label="Button 3"
            data-number="3">
        </button>

        <!-- BUTTON 4 -->
        <button
            class="glass-button"
            aria-label="Button 4"
            data-number="4">
        </button>

        <!-- BUTTON 5 -->
        <button
            class="glass-button"
            aria-label="Button 5"
            data-number="5">
        </button>

    </div>

</main>


<script>

/* =========================
   SECRET COMBINATION
   ========================= */

const secretCode = "12344";


/* =========================
   CURRENT SEQUENCE
   ========================= */

let sequence = "";


/* =========================
   AUDIO
   ========================= */

let audioContext = null;


/*
   Create a subtle electronic
   click sound.
*/

function playClickSound() {

    /*
       Create AudioContext only after
       the user interacts with the page.
       This is required by mobile browsers.
    */

    if (!audioContext) {

        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }


    /*
       Resume the AudioContext if the
       browser has suspended it.
    */

    if (audioContext.state === "suspended") {

        audioContext.resume();

    }


    /*
       Create oscillator.
    */

    const oscillator =
        audioContext.createOscillator();


    /*
       Create volume control.
    */

    const gainNode =
        audioContext.createGain();


    /*
       Soft sine-wave sound.
    */

    oscillator.type = "sine";


    /*
       Starting frequency.
    */

    oscillator.frequency.setValueAtTime(
        520,
        audioContext.currentTime
    );


    /*
       Quickly lower the pitch.
       This gives it a physical
       "click" character.
    */

    oscillator.frequency.exponentialRampToValueAtTime(
        180,
        audioContext.currentTime + 0.055
    );


    /*
       Start almost silent.
    */

    gainNode.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
    );


    /*
       Very quick attack.
    */

    gainNode.gain.exponentialRampToValueAtTime(
        0.055,
        audioContext.currentTime + 0.005
    );


    /*
       Very quick fade out.
    */

    gainNode.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 0.065
    );


    /*
       Connect everything.
    */

    oscillator.connect(gainNode);

    gainNode.connect(
        audioContext.destination
    );


    /*
       Start sound.
    */

    oscillator.start();


    /*
       Stop sound.
    */

    oscillator.stop(
        audioContext.currentTime + 0.07
    );

}


/* =========================
   GET BUTTONS
   ========================= */

const buttons =
    document.querySelectorAll(".glass-button");


/* =========================
   BUTTON HANDLERS
   ========================= */

buttons.forEach(button => {

    button.addEventListener("click", () => {

        /*
           Play sound on every press.
        */

        playClickSound();


        /*
           Add the hidden button
           number to the sequence.
        */

        sequence += button.dataset.number;


        /*
           CHECK SECRET CODE
        */

        if (sequence === secretCode) {

            /*
               Correct combination.
               Redirect to index.html.
            */

            window.location.href =
                "index.html";

            return;
        }


        /*
           If the current sequence
           cannot possibly become the
           secret code, reset it.
        */

        if (!secretCode.startsWith(sequence)) {

            sequence = "";

        }

    });

});

</script>

</body>
</html>
